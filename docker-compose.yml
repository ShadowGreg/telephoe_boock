services:
  postgres:
    image: postgres:16-alpine
    container_name: phonebook-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: phonebook
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/Host/PhoneBook.Api/Dockerfile
    container_name: phonebook-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Contacts: "Host=postgres;Port=5432;Database=phonebook;Username=postgres;Password=postgres;Pooling=true;MinPoolSize=1;MaxPoolSize=20;ConnectionLifetime=300;Timeout=30;CommandTimeout=30;Keepalive=30"
      Contacts__Storage: Postgres
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: phonebook-frontend
    ports:
      - "3000:80"

  proxy:
    image: nginx:alpine
    container_name: phonebook-proxy
    depends_on:
      - api
      - frontend
    ports:
      - "5091:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
